<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- گرادینت پس‌زمینه اصلی -->
        <linearGradient id="mainBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1D9E75"/>
            <stop offset="100%" stop-color="#1D60D2"/>
        </linearGradient>
        <!-- گرادینت دایره تیک -->
        <linearGradient id="checkCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1D9E75"/>
            <stop offset="100%" stop-color="#1D6EEB"/>
        </linearGradient>
    </defs>

    <!-- ۱. پس‌زمینه مربعی گرد -->
    <rect width="100" height="100" rx="26" fill="url(#mainBgGrad)"/>

    <!-- ۲. برگه سفید -->
    <rect x="20" y="18" width="48" height="64" rx="12" fill="white"/>

    <!-- ۳. خطوط افقی روی برگه -->
    <rect x="28" y="30" width="28" height="5" rx="2.5" fill="#A8CDEC"/>
    <rect x="28" y="42" width="22" height="5" rx="2.5" fill="#A8CDEC"/>
    <rect x="28" y="54" width="16" height="5" rx="2.5" fill="#A8CDEC"/>

    <!-- ۴. ۳ نقطه شفاف سمت راست -->
    <circle cx="78" cy="28" r="4" fill="white" opacity="0.6"/>
    <circle cx="78" cy="40" r="4" fill="white" opacity="0.8"/>
    <circle cx="78" cy="52" r="4" fill="white" opacity="0.6"/>

    <!-- ۵. دایره تیک دار در پایین -->
    <circle cx="68" cy="68" r="18" fill="url(#checkCircleGrad)"/>
    <path d="M59 68L65 74L77 62" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
