<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
  <defs>
    <linearGradient id="flowFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D9E75"/>
      <stop offset="100%" stop-color="#378ADD"/>
    </linearGradient>
  </defs>
  
  <!-- پس‌زمینه با گوشه‌های گرد -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#flowFavicon)"/>
  
  <!-- خط اتصال (انتقال‌یافته به مرکز عمودی دقیق: Y=32) -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  
  <!-- نقاط مسیر (تراز شده روی Y=32) -->
  <circle cx="18" cy="32" r="4.5" fill="white" opacity="0.5"/>
  <circle cx="32" cy="32" r="4.5" fill="white" opacity="0.8"/>
  <circle cx="46" cy="32" r="7" fill="white"/>
  
  <!-- تیک سبز/آبی داخل نقطه اصلی -->
  <polyline points="43,31 46,35 50,28" fill="none" stroke="url(#flowFavicon)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
