{% extends "base.html" %}
{% block content %}

<div class="container" style="max-width: 400px; min-height: 70vh; display: flex; flex-direction: column; justify-content: center; margin: 0 auto;">
    
    <!-- Überschrift für den Registrierungsbereich -->
    <h2 style="font-size: 1.3em; font-weight: 600; color: #0f172a; margin-bottom: 20px; text-align: center;">
        {{ _('Registrieren') }}
    </h2>

    <!-- Registrierungsformular mit POST-Request -->
    <form method="POST">
        <div style="display: flex; flex-direction: column; gap: 16px;">
            
            <!-- Eingabefeld für die E-Mail-Adresse -->
            <input type="email" name="email" placeholder="{{ _('E-Mail-Adresse') }}" required autofocus class="inset-input">
            
            <!-- Eingabefeld für das Passwort mit Augen-Symbol zum Einblenden/Ausblenden -->
            <div x-data="{ showPassword: false }" style="position: relative; width: 100%;">
                <input :type="showPassword ? 'text' : 'password'" name="password" placeholder="{{ _('Passwort (mind. 8 Zeichen)') }}" minlength="8" required class="inset-input" style="padding-right: 40px; width: 100%; box-sizing: border-box;">
                
                <!-- Schaltfläche für das Augen-Icon -->
                <button type="button" @click="showPassword = !showPassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; color: #64748b; display: flex; align-items: center;">
                    <!-- Offenes Auge (Passwort verbergen) -->
                    <svg x-show="!showPassword" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <!-- Durchgestrichenes Auge (Passwort anzeigen) -->
                    <svg x-show="showPassword" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>
            
            <!-- Checkbox für die Akzeptanz der Datenschutzerklärung -->
            <div style="display: flex; align-items: flex-start; gap: 10px; font-size: 0.85em; color: #475569;">
                <input type="checkbox" id="privacy" name="privacy" required>
                <label for="privacy" style="cursor: pointer; line-height: 1.4;">
                    {{ _('Ich habe die') }} <a href="{{ url_for('datenschutz') }}" target="_blank" style="color: #378ADD; text-decoration: none;">{{ _('Datenschutzerklärung') }}</a> {{ _('gelesen und akzeptiere sie.') }}
                </label>
            </div>

            <!-- Absendeschaltfläche für die Registrierung -->
            <button type="submit" class="btn-primary" style="width: 100%; height: 42px; font-size: 0.95em; font-weight: 500;">
                {{ _('Konto erstellen') }}
            </button>
        </div>
    </form>

    <!-- Link für Benutzer, die bereits ein Konto haben -->
    <p style="margin-top: 20px; text-align: center; font-size: 0.85em; color: #64748b;">
        {{ _('Bereits ein Konto?') }} <a href="{{ url_for('login') }}" style="color: #378ADD; text-decoration: none; font-weight: 500;">{{ _('Hier anmelden') }}</a>
    </p>
</div>
{% endblock %}
