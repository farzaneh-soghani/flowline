{% extends "base.html" %}
{% block content %}

<div class="container" style="max-width: 400px; min-height: 70vh; display: flex; flex-direction: column; justify-content: center; margin: 0 auto;">
    
    <!-- Überschrift für den Registrierungsbereich -->
    <h2 style="font-size: 1.3em; font-weight: 600; color: #0f172a; margin-bottom: 20px; text-align: center;">
        {{ _('Registrieren') }}
    </h2>

    <!-- Registrierungsformular mit POST-Request -->
    <form method="POST">
        <div style="display: flex; flex-direction: column; gap: 16px;">
            
            <!-- Eingabefeld für die E-Mail-Adresse -->
            <input type="email" name="email" placeholder="{{ _('E-Mail-Adresse') }}" required autofocus class="inset-input">
            
            <!-- Eingabefeld für das Passwort mit Längenbeschränkung -->
            <input type="password" name="password" placeholder="{{ _('Passwort (mind. 8 Zeichen)') }}" minlength="8" required class="inset-input">
            
            <!-- Checkbox für die Akzeptanz der Datenschutzerklärung -->
            <div style="display: flex; align-items: flex-start; gap: 10px; font-size: 0.85em; color: #475569;">
                <input type="checkbox" id="privacy" name="privacy" required>
                <label for="privacy" style="cursor: pointer; line-height: 1.4;">
                    {{ _('Ich habe die') }} <a href="{{ url_for('datenschutz') }}" target="_blank" style="color: #378ADD; text-decoration: none;">{{ _('Datenschutzerklärung') }}</a> {{ _('gelesen und akzeptiere sie.') }}
                </label>
            </div>

            <!-- Absendeschaltfläche für die Registrierung -->
            <button type="submit" class="btn-primary" style="width: 100%; height: 42px; font-size: 0.95em; font-weight: 500;">
                {{ _('Konto erstellen') }}
            </button>
        </div>
    </form>

    <!-- Link für Benutzer, die bereits ein Konto haben -->
    <p style="margin-top: 20px; text-align: center; font-size: 0.85em; color: #64748b;">
        {{ _('Bereits ein Konto?') }} <a href="{{ url_for('login') }}" style="color: #378ADD; text-decoration: none; font-weight: 500;">{{ _('Hier anmelden') }}</a>
    </p>
</div>
{% endblock %}
