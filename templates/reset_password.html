{% extends "base.html" %}
{% block content %}

<div class="container" style="max-width: 400px; min-height: 70vh; display: flex; flex-direction: column; justify-content: center; margin: 0 auto;">
    
    <!-- Überschrift für die Eingabe des neuen Passworts -->
    <h2 style="font-size: 1.3em; font-weight: 600; color: #0f172a; margin-bottom: 8px; text-align: center;">
        {{ _('Neues Passwort eingeben') }}
    </h2>
    
    <!-- Beschreibungstext mit Hinweisen zur Mindestlänge -->
    <p style="font-size: 0.85em; color: #64748b; text-align: center; margin-top: 0; margin-bottom: 20px;">
        {{ _('Bitte geben Sie Ihr neues Passwort ein (mindestens 8 Zeichen).') }}
    </p>

    <!-- Formular zum Zurücksetzen des Passworts mit Token-Übergabe -->
    <form method="POST" action="{{ url_for('reset_password', token=token) }}">
        <div style="display: flex; flex-direction: column; gap: 16px;">
            
            <!-- Eingabefeld für das neue Passwort mit Längenbeschränkung -->
            <input type="password" name="password" minlength="8" placeholder="{{ _('Neues Passwort') }}" required autofocus class="inset-input">
            
            <!-- Absendeschaltfläche zum Speichern des neuen Passworts -->
            <button type="submit" class="btn-primary" style="width: 100%; height: 42px; font-size: 0.95em; font-weight: 500; cursor: pointer;">
                {{ _('Passwort speichern') }}
            </button>
            
        </div>
    </form>
    
    <!-- Link zur Rückkehr zur Anmeldeseite -->
    <div style="margin-top: 20px; text-align: center;">
        <a href="{{ url_for('login') }}" style="color: #64748b; font-size: 0.85em; text-decoration: none;">
            {{ _('Zurück zum Login') }}
        </a>
    </div>

</div>

{% endblock %}
